<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobilys — Cadastros</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-shell" id="app-shell">

  <nav class="navbar navbar-dark topo-navbar fixed-top">
    <div class="container-fluid px-2 px-lg-3">
      <a href="admin-painel.html" class="navbar-brand topo-marca m-0">
        <img src="assets/logo.png" alt="Mobilys">
      </a>
      <div class="dropdown">
        <button class="btn topo-usuario-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <span class="badge topo-cargo" id="topo-cargo">Administrador</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
          <li><a class="dropdown-item d-flex align-items-center gap-2 link-sair" href="index.html"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid app-corpo">
    <div class="row">
      <nav class="col-lg-3 col-xl-2 d-none d-lg-flex flex-column nav-lateral" id="nav-lateral"></nav>

      <main class="col-12 col-lg-9 col-xl-10 conteudo" id="conteudo">

        <div class="cabecalho-secao">
          <h1>Cadastros</h1>
          <p class="desc">Gestão de alunos, rotas, motoristas, veículos e usuários</p>
        </div>
        <div class="linha-rota"></div>

        <div class="d-flex flex-wrap gap-2 mb-3" id="abas-cadastro" role="tablist"></div>

        <div class="d-flex flex-wrap gap-2 mb-3">
          <div class="flex-grow-1 busca" style="min-width:160px;">
            <input type="search" class="form-control" id="busca-cadastro" placeholder="Buscar...">
          </div>
          <button class="btn btn-primary d-flex align-items-center gap-1" id="btn-novo-cadastro">
            <i class="bi bi-plus-lg"></i> Novo
          </button>
        </div>

        <div class="card painel">
          <div class="card-body p-0 tabela-scroll">
            <table class="table table-hover align-middle mb-0">
              <thead id="cabecalho-tabela-cadastro"></thead>
              <tbody id="corpo-tabela-cadastro"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <nav class="nav-inferior d-lg-none" id="nav-inferior"></nav>
  <div class="rodape-app">Mobilys — Sistema de gestão de transporte estudantil · Trabalho de Conclusão de Curso, 2026</div>
</div>

<!-- Modal Bootstrap (cadastro / edição / associação) -->
<div class="modal fade" id="modal-cadastro" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5 m-0" id="modal-titulo">Novo registro</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <form id="modal-form"></form>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index:1080;">
  <div id="toast-mobilys" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body d-flex align-items-center gap-2" id="toast-corpo"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>iniciarPagina('admin-cadastros');</script>
</body>
</html>
