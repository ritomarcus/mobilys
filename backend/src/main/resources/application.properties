spring.application.name=mobilys-api
spring.config.import=optional:file:.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mobilys}
spring.datasource.username=${DB_USER:${POSTGRES_USER:mobilys}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
mobilys.cors.allowed-origins=${FRONTEND_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
mobilys.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
mobilys.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
